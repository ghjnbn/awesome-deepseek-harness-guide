name: Docs Check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: Markdown lint & link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Lint markdown
        run: npx --yes markdownlint-cli2 "**/*.md"

      - name: Check internal links
        run: |
          npx --yes markdown-link-check --quiet README.md CONTRIBUTING.md
